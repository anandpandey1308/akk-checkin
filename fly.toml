# fly.toml app configuration file generated for akk-checkin on 2026-07-15T19:29:29+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'akk-checkin'
primary_region = 'cdg'

[build]
[[mounts]]
  source = 'akk_checkin_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
